<!doctype html><html><head><meta charset="utf-8"><title>LoanPilot calculation tests</title><style>body{font:14px system-ui;max-width:800px;margin:40px auto;padding:0 20px}li{margin:8px 0}.pass{color:green}.fail{color:#b22}</style></head><body><h1>LoanPilot regression tests</h1><p>Open this file in a browser. Results below are calculated locally.</p><ol id="results"></ol><script src="../calculations.js"></script><script src="../csv-utils.js"></script><script src="../reports.js"></script><script src="../prepayment-advisor.js"></script><script>
const tests=[];function test(name,fn){try{if(!fn())throw Error('assertion failed');tests.push([name,true])}catch(e){tests.push([name,false,e.message])}}
test('EMI calculation returns positive amount',()=>LoanCalc.emiFor(100000,12,12)>8800&&LoanCalc.emiFor(100000,12,12)<9000);
test('Zero-rate EMI equals principal / tenure',()=>Math.abs(LoanCalc.emiFor(12000,0,12)-1000)<.001);
test('Amortization closes balance without going negative',()=>{let s=LoanCalc.simulateLoan({id:'a',principal:100000,rate:10,emi:9000,tenure:12,dueDate:'2026-01-05'});return s.remainingPrincipal>=0&&s.rows[s.rows.length-1].closing===0});
test('Recurring monthly prepayment is applied more than once',()=>{let s=LoanCalc.simulateLoan({id:'a',principal:100000,rate:10,emi:9000,tenure:12,dueDate:'2026-01-05'},{prepayments:[{id:'p',loanId:'a',amount:500,startDate:'2026-01-05',endDate:'2026-04-05',frequency:'Monthly',status:'Active'}]});return s.rows.reduce((a,r)=>a+r.prepayment,0)>=1500});
test('Prepayment dated between EMI dates is applied on the next installment',()=>{let s=LoanCalc.simulateLoan({id:'a',principal:100000,rate:10,emi:9000,tenure:12,dueDate:'2026-11-15'},{prepayments:[{id:'p',loanId:'a',amount:5000,startDate:'2026-11-08',endDate:'2026-11-08',frequency:'One-time',status:'Active'}]});return s.rows[0].prepayment===5000&&s.rows[0].date==='2026-11-15'});
test('Scenario date before the next EMI is not dropped',()=>{let loan={id:'a',principal:100000,rate:10,emi:9000,tenure:12,dueDate:'2026-11-15'},plan={id:'s',loanId:'a',amount:10000,startDate:'2026-11-01',endDate:'2026-11-01',frequency:'One-time',status:'Active'},withPlan=LoanCalc.simulateLoan(loan,{prepayments:[plan]}),withoutPlan=LoanCalc.simulateLoan(loan);return withPlan.rows[0].prepayment===10000&&withPlan.totalInterest<withoutPlan.totalInterest});
test('Paying off a shorter target loan still reports its saved installments',()=>{let loans=[{id:'short',principal:100000,rate:0,emi:10000,tenure:10,dueDate:'2026-01-05',status:'Active'},{id:'long',principal:100000,rate:0,emi:1000,tenure:100,dueDate:'2026-01-05',status:'Active'}],baseline=LoanCalc.portfolioSimulation(loans),scenario=LoanCalc.portfolioSimulation(loans,[{id:'scenario',loanId:'short',amount:100000,startDate:'2026-01-05',endDate:'2026-01-05',frequency:'One-time',status:'Active'}]),baselineTarget=baseline.schedules.find(s=>s.loanId==='short'),scenarioTarget=scenario.schedules.find(s=>s.loanId==='short');return baseline.months===scenario.months&&baselineTarget.months-scenarioTarget.months===9});
test('Prepayment below configured minimum is skipped',()=>{let loan={id:'a',principal:10000,rate:0,emi:1000,tenure:12,dueDate:'2026-01-05',minPrepay:2000},plan={id:'p',loanId:'a',amount:1000,startDate:'2026-01-05',endDate:'2026-01-05',frequency:'One-time'};return LoanCalc.simulateLoan(loan,{prepayments:[plan]}).rows[0].prepayment===0});
test('Monthly optional cap clips each prepayment to 10% of opening principal',()=>{let loan={id:'a',principal:100000,rate:0,emi:1000,tenure:12,dueDate:'2026-01-05',monthlyPrepayLimitPct:10},plan={id:'p',loanId:'a',amount:50000,startDate:'2026-01-05',endDate:'2026-03-05',frequency:'Monthly'},rows=LoanCalc.simulateLoan(loan,{prepayments:[plan]}).rows;return rows.length>=3&&rows.every(r=>r.prepayment<=r.opening*.1+.01)&&rows[0].prepayment===10000});
test('Financial-year optional cap limits total to 25% and resets in April',()=>{let loan={id:'a',principal:100000,rate:0,emi:1000,tenure:12,dueDate:'2026-01-05',financialYearPrepayLimitPct:25},plan={id:'p',loanId:'a',amount:10000,startDate:'2026-01-05',endDate:'2026-06-05',frequency:'Monthly'},rows=LoanCalc.simulateLoan(loan,{prepayments:[plan]}).rows,janToMar=rows.filter(r=>r.date<'2026-04-01').reduce((s,r)=>s+r.prepayment,0),aprOpening=rows.find(r=>r.date.startsWith('2026-04')).opening,aprToJun=rows.filter(r=>r.date>='2026-04-01'&&r.date<'2026-07-01').reduce((s,r)=>s+r.prepayment,0);return janToMar===25000&&aprToJun<=aprOpening*.25+.01&&aprToJun>0});
test('Optional prepayment caps do not limit a loan when blank',()=>{let loan={id:'a',principal:100000,rate:0,emi:1000,tenure:12,dueDate:'2026-01-05'},plan={id:'p',loanId:'a',amount:50000,startDate:'2026-01-05',endDate:'2026-01-05',frequency:'One-time'};return LoanCalc.simulateLoan(loan,{prepayments:[plan]}).rows[0].prepayment===50000});
test('Month-end EMI dates remain anchored without drifting',()=>{let s=LoanCalc.simulateLoan({id:'a',principal:100000,rate:0,emi:5000,tenure:24,dueDate:'2026-01-31'});return s.rows[0].date==='2026-01-31'&&s.rows[1].date==='2026-02-28'&&s.rows[2].date==='2026-03-31'});
test('Daily interest uses the previous anchored EMI date for month-end schedules',()=>{let s=LoanCalc.simulateLoan({id:'a',principal:100000,rate:12,emi:5000,tenure:24,dueDate:'2026-01-31',method:'daily'}),firstInterest=LoanCalc.round(100000*.12*31/365),firstPrincipal=LoanCalc.round(5000-firstInterest),secondInterest=LoanCalc.round((100000-firstPrincipal)*.12*28/365);return s.rows[1].interest===secondInterest});
test('CSV parser preserves commas, quotes and newline',()=>{let x=CSVUtils.parseCSV('name,notes\r\nHome,"hello, ""world""\nnext"');return x[0].name==='Home'&&x[0].notes==='hello, "world"\nnext'});
test('Prepayment cannot create negative balance',()=>{let s=LoanCalc.simulateLoan({id:'a',principal:1000,rate:0,emi:500,tenure:3,dueDate:'2026-01-01'},{prepayments:[{id:'p',loanId:'a',amount:100000,startDate:'2026-01-01',endDate:'2026-01-01',frequency:'One-time'}]});return s.rows.every(r=>r.closing>=0)});
test('Advisor honors maximum allocation per loan',()=>{let loans=[{id:'a',name:'A',status:'Active',principal:10000,rate:12,emi:1000,tenure:12,dueDate:'2026-01-05',eligible:true},{id:'b',name:'B',status:'Active',principal:10000,rate:8,emi:1000,tenure:12,dueDate:'2026-01-05',eligible:true}],r=PrepaymentAdvisor.recommend(loans,[],10000,'2026-01-05','Balanced',{maxPerLoan:3000});return r.candidates.every(c=>c.allocations.every(a=>a.amount<=3000))});
test('Advisor allocates monthly extra without multiplying it per loan',()=>{let loans=[{id:'a',name:'A',status:'Active',principal:100000,rate:10,emi:9000,tenure:12,dueDate:'2026-01-05',eligible:true},{id:'b',name:'B',status:'Active',principal:50000,rate:8,emi:5000,tenure:12,dueDate:'2026-01-05',eligible:true}],r=PrepaymentAdvisor.recommend(loans,[],0,'2026-01-05','Balanced',{extraMonthly:1000});return r.candidates[0].monthlyAllocations.reduce((sum,a)=>sum+a.amount,0)===1000&&r.candidates[0].sim.totalInterest<r.baseline.totalInterest});
test('Debt-free strategy ranks greatest payoff progress first',()=>{let loans=[{id:'a',name:'A',status:'Active',principal:100000,rate:10,emi:5000,tenure:24,dueDate:'2026-01-05',eligible:true},{id:'b',name:'B',status:'Active',principal:10000,rate:15,emi:1000,tenure:12,dueDate:'2026-01-05',eligible:true}],r=PrepaymentAdvisor.recommend(loans,[],15000,'2026-01-05','Debt-free date');return r.candidates[0].monthsSaved===Math.max(...r.candidates.map(c=>c.monthsSaved))});
test('Advisor reports payoff time saved for each allocated loan',()=>{let loans=[{id:'a',name:'A',status:'Active',principal:100000,rate:10,emi:5000,tenure:24,dueDate:'2026-01-05',eligible:true},{id:'b',name:'B',status:'Active',principal:50000,rate:8,emi:5000,tenure:12,dueDate:'2026-01-05',eligible:true}],r=PrepaymentAdvisor.recommend(loans,[],20000,'2026-01-05');return r.candidates.every(c=>c.accountSavings.length===1&&c.accountSavings.every(a=>{let before=r.baseline.schedules.find(s=>s.loanId===a.loanId),after=c.sim.schedules.find(s=>s.loanId===a.loanId);return before&&after&&a.monthsSaved===Math.max(0,before.months-after.months)}))});
test('Advisor per-loan comparison includes its own interest and fee impact',()=>{let loans=[{id:'a',name:'A',status:'Active',principal:100000,rate:10,emi:5000,tenure:24,dueDate:'2026-01-05',eligible:true,feeRate:2},{id:'b',name:'B',status:'Active',principal:50000,rate:8,emi:5000,tenure:12,dueDate:'2026-01-05',eligible:true}],r=PrepaymentAdvisor.recommend(loans,[],20000,'2026-01-05');return r.candidates.every(c=>c.accountSavings.every(a=>{let before=r.baseline.schedules.find(s=>s.loanId===a.loanId),after=c.sim.schedules.find(s=>s.loanId===a.loanId);return a.interestSaved===Math.max(0,LoanCalc.round(before.totalInterest-after.totalInterest))&&a.feeCost===LoanCalc.round(after.totalFees-before.totalFees)&&a.netBenefit===Math.max(0,LoanCalc.round(a.interestSaved-a.feeCost))}))});
test('Monthly portfolio reports opening balance and carry forward',()=>{let loans=[{id:'a',principal:12000,rate:0,emi:1000,tenure:12,dueDate:'2026-01-05'},{id:'b',principal:5000,rate:0,emi:1000,tenure:5,dueDate:'2026-03-05'}],rows=LoanReports.monthlyPortfolio(LoanCalc.portfolioSimulation(loans));return rows[0].opening===17000&&rows[1].opening===rows[0].closing&&rows[1].opening>=15000&&rows[2].opening===rows[1].closing});
test('Loan CSV round-trips optional prepayment caps',()=>{let row={id:'a',monthlyPrepayLimitPct:10,financialYearPrepayLimitPct:25},csv=CSVUtils.toCSV([row],CSVUtils.headers.loans),restored=CSVUtils.parseCSV(csv)[0];return restored.monthlyPrepayLimitPct==='10'&&restored.financialYearPrepayLimitPct==='25'});
const ol=document.getElementById('results');tests.forEach(([n,ok,e])=>{let li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS — ':'FAIL — ')+n+(e?' ('+e+')':'');ol.appendChild(li)});document.title=`${tests.filter(t=>t[1]).length}/${tests.length} tests passed — LoanPilot`;
</script></body></html>
