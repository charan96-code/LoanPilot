<h1>Wealth Manager financial planning regression tests</h1>
<p>Open this file in a browser. Results below are calculated locally.</p>
<ol id="results"></ol>
<script src="../calculations.js"></script>
<script src="../networth.js"></script>
<script src="../financial-planning.js"></script>
<script src="../csv-utils.js"></script>
<script>
const tests=[];
function test(name,fn){try{if(!fn())throw Error('assertion failed');tests.push([name,true])}catch(e){tests.push([name,false,e.message])}}
test('Defaults provide editable assets, income sources and assumptions',()=>{const x=NetWorthCalc.createDefaults();return x.assets.some(a=>a.name==='EPF')&&x.assets.some(a=>a.name==='NPS')&&x.assets.some(a=>a.name==='Mutual funds')&&x.incomes.some(i=>i.name==='Salary')&&x.assumptions.savingsRate===20});
test('Projection compounds assets, invests projected income and reduces loan liabilities',()=>{const profile={assets:[{id:'a',name:'Fund',value:100000,annualGrowth:10}],incomes:[{id:'i',name:'Salary',monthlyAmount:1000,annualGrowth:0}],assumptions:{savingsRate:20,contributionGrowth:0,projectionYears:2}},loan={id:'loan',status:'Active',principal:100000,rate:0,emi:5000,tenure:20,dueDate:'2026-01-01'},p=NetWorthCalc.project(profile,[loan],[],LoanCalc),year1=p.timeline[1],year2=p.timeline[2];return year1.assets===112400&&year1.liabilities===40000&&year1.netWorth===72400&&year2.assets===125800&&year2.liabilities===0&&year2.netWorth===125800});
test('Archived loans are excluded from liabilities',()=>{const p=NetWorthCalc.project({assets:[],incomes:[],assumptions:{projectionYears:1}},[{id:'old',status:'Archived',principal:50000,rate:0,emi:1000,tenure:50}],[],LoanCalc);return p.timeline[0].liabilities===0&&p.timeline[1].liabilities===0});
test('Projection assumptions are bounded when restoring data',()=>{const p=NetWorthCalc.normalize({assets:[],incomes:[],assumptions:{savingsRate:120,contributionGrowth:-5,projectionYears:99}});return p.assumptions.savingsRate===100&&p.assumptions.contributionGrowth===0&&p.assumptions.projectionYears===40});
test('Deposit terms normalize and deposit balances contribute to net worth projections through maturity',()=>{const deposit={id:'fd-1',name:'Fixed deposit',assetType:'Deposit',depositType:'FD',value:10000,investedAmount:10000,annualRate:5,annualGrowth:5,maturityMonths:12,interestPayoutFrequency:'Maturity',principalPayoutFrequency:'Maturity'},profile=NetWorthCalc.normalize({assets:[deposit],incomes:[],assumptions:{projectionYears:2}}),projection=NetWorthCalc.project(profile,[],[],LoanCalc),estimate=NetWorthCalc.depositMaturityEstimate(profile.assets[0],new Date(2026,0,1));return profile.assets[0].depositType==='FD'&&projection.timeline[0].assets===10000&&projection.timeline[1].assets===10500&&projection.timeline[2].assets===10500&&estimate.months===12&&estimate.value>10500});
test('Maturity reminders respect lead months and a zero-month reminder window',()=>{const asOf=new Date(2026,0,10),due=NetWorthCalc.maturityReminder({assetType:'Deposit',maturityDate:'2026-04-09',maturityReminderMonths:3,renewalStatus:'Pending'},asOf),notDue=NetWorthCalc.maturityReminder({assetType:'Deposit',maturityDate:'2026-01-11',maturityReminderMonths:0,renewalStatus:'Pending'},asOf);return due.due&&due.daysRemaining===89&&!notDue.due});
test('Month-only maturity stays anchored to the date it is calculated',()=>{const asOf=new Date(2026,5,1),maturity=NetWorthCalc.maturityDate({assetType:'Deposit',maturityMonths:12},asOf);return maturity?.getFullYear()===2027&&maturity?.getMonth()===5&&maturity?.getDate()===1});
test('Deposit tax estimate treats TDS as a credit against configured tax',()=>{const estimate=NetWorthCalc.depositTaxEstimate({assetType:'Deposit',depositType:'FD',investedAmount:10000,annualRate:10,maturityMonths:12,estimatedTaxRate:20,estimatedTdsRate:10},new Date(2026,0,1));return estimate.grossInterest===1000&&estimate.estimatedTax===200&&estimate.estimatedTds===100&&estimate.estimatedTaxAfterTds===100&&estimate.netInterest===800});
test('Deposit CSV preserves renewal, redemption, reminder and tax fields',()=>{const row={id:'fd-2',name:'Renewal FD',assetType:'Deposit',depositType:'FD',value:9000,investedAmount:9000,annualRate:6,maturityReminderMonths:2,renewalAction:'Renew principal + interest',renewalStatus:'Pending',renewalTermMonths:18,renewalRate:7,renewalCount:2,lastRenewedAt:'2025-01-01',lastRenewalAction:'Renew principal',redeemedValue:0,estimatedTaxRate:20,estimatedTdsRate:10},restored=CSVUtils.parseCSV(CSVUtils.toCSV([row],CSVUtils.headers.deposits))[0];return restored.renewalAction===row.renewalAction&&restored.renewalTermMonths==='18'&&restored.lastRenewalAction===row.lastRenewalAction&&restored.estimatedTaxRate==='20'&&restored.redeemedValue==='0'});
test('Deposit maturity date controls months remaining and scheduled payouts appear in the cash-flow calendar',()=>{const asOf=new Date(2026,0,10),deposit={id:'bond-1',name:'Quarterly bond',assetType:'Deposit',depositType:'Bond',value:10000,investedAmount:10000,annualRate:5,annualGrowth:5,investedDate:'2025-01-15',maturityDate:'2026-04-15',interestPayoutFrequency:'Quarterly',principalPayoutFrequency:'Maturity'},months=NetWorthCalc.monthsToMaturity(deposit,asOf),events=FinancialPlanning.cashflowCalendar({assets:[deposit],asOf,months:4}),interest=events.find(event=>event.type==='Deposit interest'&&event.date==='2026-01-15'),principal=events.find(event=>event.type==='Deposit principal'&&event.date==='2026-04-15');return months===3&&interest?.amount===125&&principal?.amount===10000});
test('Deposit payout frequencies support monthly, quarterly, half-yearly, yearly and maturity for both payout types',()=>{const frequencies=['Monthly','Quarterly','Half-yearly','Yearly','Maturity'];return frequencies.every(frequency=>{const asset=NetWorthCalc.normalize({assets:[{id:'payout',assetType:'Deposit',interestPayoutFrequency:frequency,principalPayoutFrequency:frequency}],incomes:[]}).assets[0];return asset.interestPayoutFrequency===frequency&&asset.principalPayoutFrequency===frequency})});
test('Periodic principal payout is reflected as cash-flow inflows',()=>{const events=FinancialPlanning.cashflowCalendar({asOf:new Date(2026,0,10),months:7,assets:[{id:'rd-1',name:'Quarterly bond',assetType:'Deposit',value:10000,investedAmount:10000,annualRate:6,investedDate:'2026-01-01',maturityDate:'2026-07-01',interestPayoutFrequency:'Monthly',principalPayoutFrequency:'Quarterly'}]}),principal=events.filter(event=>event.type==='Deposit principal');return principal.length===2&&principal[0].amount===5000&&principal[1].amount===5000&&principal[0].date==='2026-04-01'&&principal[1].date==='2026-07-01'});
test('Recurring deposit installments and their projected maturity principal appear in the calendar',()=>{const events=FinancialPlanning.cashflowCalendar({asOf:new Date(2026,0,10),months:4,assets:[{id:'rd-2',name:'Monthly RD',assetType:'Deposit',depositType:'RD',value:10000,investedAmount:10000,monthlyContribution:1000,annualRate:6,investedDate:'2026-01-01',maturityDate:'2026-04-10',interestPayoutFrequency:'Maturity',principalPayoutFrequency:'Maturity'}]}),installments=events.filter(event=>event.type==='RD installment'),principal=events.find(event=>event.type==='Deposit principal');return installments.length===3&&principal?.amount===13000&&installments[0].date==='2026-01-10'});
test('Scheduled deposit tax is an outflow and TDS is described as a credit',()=>{const events=FinancialPlanning.cashflowCalendar({asOf:new Date(2026,0,1),months:2,assets:[{name:'Taxable FD',assetType:'Deposit',value:10000,investedAmount:10000,annualRate:12,investedDate:'2026-01-01',maturityDate:'2026-03-01',interestPayoutFrequency:'Monthly',principalPayoutFrequency:'Maturity',estimatedTaxRate:20,estimatedTdsRate:10}]}),tax=events.find(event=>event.type==='Deposit tax');return !!tax&&tax.direction==='out'&&tax.amount===20&&tax.detail.includes('estimated TDS credit 10.00')});
test('Redeemed deposit records normalize with zero active value and retain redemption history',()=>{const asset=NetWorthCalc.normalize({assets:[{id:'fd-3',assetType:'Deposit',value:0,redeemedValue:12000,renewalStatus:'Redeemed'}]}).assets[0];return asset.value===0&&asset.redeemedValue===12000&&asset.renewalStatus==='Redeemed'});
test('Net-worth assets and income export CSV headers round-trip',()=>{const assets=[{id:'a',name:'Index fund',value:125000,annualGrowth:10}],incomes=[{id:'i',name:'Salary',monthlyAmount:80000,annualGrowth:7}],a=CSVUtils.parseCSV(CSVUtils.toCSV(assets,CSVUtils.headers.assets))[0],i=CSVUtils.parseCSV(CSVUtils.toCSV(incomes,CSVUtils.headers.incomes))[0];return a.value==='125000'&&a.annualGrowth==='10'&&i.monthlyAmount==='80000'&&i.annualGrowth==='7'});
test('Deposit CSV template preserves payout options and is identified as deposit data',()=>{const row={id:'fd-1',name:'Quarterly FD',assetType:'Deposit',depositType:'FD',value:10000,annualGrowth:7,investedAmount:10000,annualRate:7,investedDate:'2026-01-01',maturityDate:'2027-01-01',maturityMonths:12,interestPayoutFrequency:'Quarterly',principalPayoutFrequency:'Maturity'},restored=CSVUtils.parseCSV(CSVUtils.toCSV([row],CSVUtils.headers.deposits))[0];return CSVUtils.identifyDataType('deposits.csv',CSVUtils.headers.deposits)==='deposits'&&restored.depositType==='FD'&&restored.interestPayoutFrequency==='Quarterly'&&restored.principalPayoutFrequency==='Maturity'});
test('Net-worth projection assumptions export as an importable CSV',()=>{const rows=[{key:'savingsRate',value:20},{key:'contributionGrowth',value:8},{key:'projectionYears',value:10}],restored=CSVUtils.parseCSV(CSVUtils.toCSV(rows,CSVUtils.headers.networthSettings));return restored.length===3&&restored[0].key==='savingsRate'&&restored[2].value==='10'});
test('Emergency fund uses only essential costs and explicitly eligible liquid assets',()=>{const fund=FinancialPlanning.emergencyFund([{name:'Savings',value:75000,emergencyEligible:true},{name:'Mutual funds',value:200000,emergencyEligible:false}],[{name:'Housing',monthlyAmount:20000,essential:true},{name:'Dining',monthlyAmount:5000,essential:false}],6);return fund.essentialExpenses===20000&&fund.liquidAssets===75000&&fund.target===120000&&fund.monthsCovered===3.75&&fund.remaining===45000&&fund.progress===62.5});
test('Emergency-fund settings normalize with a six-month default and bounded range',()=>{const defaults=FinancialPlanning.normalize(undefined),bounded=FinancialPlanning.normalize({assumptions:{emergencyFundMonths:99}});return defaults.assumptions.emergencyFundMonths===6&&bounded.assumptions.emergencyFundMonths===24});
test('Legacy asset names identify savings as liquid while keeping investments excluded',()=>{const p=NetWorthCalc.normalize({assets:[{name:'Savings & fixed deposits',value:1000},{name:'Mutual funds',value:5000}],incomes:[]});return p.assets[0].emergencyEligible===true&&p.assets[1].emergencyEligible===false});
test('Cash-flow calendar includes scheduled loan payments, expenses, goals, income, savings, prepayments and net bonuses',()=>{const events=FinancialPlanning.cashflowCalendar({asOf:new Date(2026,0,10),months:3,loans:[{id:'l',name:'Home loan',status:'Active',emi:1000,dueDate:'2026-01-15'}],prepayments:[{loanId:'l',name:'Extra',amount:500,frequency:'Monthly',startDate:'2026-02-15',status:'Active'}],expenses:[{name:'Rent',monthlyAmount:2000}],goals:[{name:'Emergency goal',currentAmount:0,targetAmount:1000,monthlyContribution:400}],incomes:[{name:'Salary',monthlyAmount:100000}],savingsRate:20,bonuses:[{name:'Bonus',amount:10000,reservePercent:20,emergencyReserve:1000,date:'2026-03-01',status:'Estimated'}]});return events.some(x=>x.date==='2026-01-15'&&x.type==='Loan EMI'&&x.amount===1000)&&events.some(x=>x.date==='2026-02-15'&&x.type==='Prepayment')&&events.some(x=>x.label==='Emergency goal'&&x.date==='2026-03-01'&&x.amount===200)&&events.some(x=>x.type==='Income'&&x.label==='Salary'&&x.date==='2026-01-10'&&x.amount===100000)&&events.some(x=>x.type==='Savings'&&x.date==='2026-01-10'&&x.amount===19600)&&events.some(x=>x.type==='Bonus'&&x.date==='2026-03-01'&&x.amount===7000)&&events.filter(x=>x.label==='Rent').length===3});
test('Month-end calendar schedules remain anchored and closed loans are excluded',()=>{const events=FinancialPlanning.cashflowCalendar({asOf:new Date(2026,0,1),months:4,loans:[{name:'Month-end loan',status:'Active',emi:100,dueDate:'2026-01-31'},{name:'Closed',status:'Closed',emi:300,dueDate:'2026-01-10'}]});return events.filter(x=>x.type==='Loan EMI').map(x=>x.date).join(',')==='2026-01-31,2026-02-28,2026-03-31,2026-04-30'});
test('Recurring prepayments and bonuses use anchored month-end dates',()=>{const events=FinancialPlanning.cashflowCalendar({asOf:new Date(2026,0,1),months:4,loans:[{id:'l',status:'Active'}],prepayments:[{loanId:'l',name:'Monthly',amount:100,frequency:'Monthly',startDate:'2025-01-31',status:'Active'}],bonuses:[{name:'Annual',amount:1000,date:'2025-04-30',frequency:'Annual',status:'Confirmed'}]});return events.filter(x=>x.type==='Prepayment').map(x=>x.date).join(',')==='2026-01-31,2026-02-28,2026-03-31,2026-04-30'&&events.filter(x=>x.type==='Bonus').map(x=>x.date).join(',')==='2026-04-30'});
test('Cash-flow surplus accounts for income, expenses, EMI and additional debt payments',()=>{const f=FinancialPlanning.cashflow([{monthlyAmount:100000}],[{monthlyAmount:30000}],[{status:'Active',emi:20000},{status:'Closed',emi:1000}],[{balance:10000,monthlyPayment:5000},{balance:0,monthlyPayment:9000}]);return f.income===100000&&f.totalCommitments===55000&&f.surplus===45000});
test('Cash flow includes goal contributions and active recurring prepayments',()=>{const f=FinancialPlanning.cashflow([{monthlyAmount:100000}],[],[],[],[{targetAmount:10000,currentAmount:0,monthlyContribution:2000}],[{status:'Active',amount:3000,frequency:'Quarterly'},{status:'Paused',amount:9000,frequency:'Monthly'},{status:'Active',amount:6000,frequency:'Monthly',startDate:'2999-01-01'}]);return f.goalContributions===2000&&f.plannedPrepayments===1000&&f.surplus===97000});
test('Backup prepayments show as upcoming until their configured start date',()=>{const loans=[{id:'loan-a',status:'Active'}],plans=[{id:'monthly',name:'Monthy Extra Prepayment',loanId:'loan-a',amount:15000,frequency:'Monthly',startDate:'2026-12-01',endDate:'',status:'Active'},{id:'annual',name:'Yearly Bonus',loanId:'loan-a',amount:100000,frequency:'Annual',startDate:'2027-04-30',endDate:'',status:'Active'}],before=FinancialPlanning.cashflow([],[],loans,[],[],plans,0,new Date(2026,9,21)),after=FinancialPlanning.cashflow([],[],loans,[],[],plans,0,new Date(2026,11,15));return before.plannedPrepayments===0&&before.upcomingPrepayments.length===2&&before.upcomingPrepayments[0].amount===15000&&after.plannedPrepayments===15000&&after.upcomingPrepayments.length===1});
test('Provided backup cash flow shows exact future-starting prepayment amounts',()=>{const plans=[{loanId:'loan-a',name:'Monthy Extra Prepayment',amount:15000,frequency:'Monthly',startDate:'2026-12-01',status:'Active'},{loanId:'loan-b',name:'Yearly Bonus',amount:100000,frequency:'Annual',startDate:'2027-04-30',status:'Active'}],loans=[{id:'loan-a',status:'Active',emi:19196},{id:'loan-b',status:'Active',emi:15285}],incomes=[{monthlyAmount:127000}],expenses=[{monthlyAmount:22000},{monthlyAmount:15000},{monthlyAmount:3000},{monthlyAmount:1500}],goals=[{targetAmount:200000,currentAmount:50000,monthlyContribution:10000}],f=FinancialPlanning.cashflow(incomes,expenses,loans,[],goals,plans,20,new Date(2026,9,21));return f.plannedPrepayments===0&&f.upcomingPrepayments.reduce((sum,x)=>sum+x.amount,0)===115000&&f.surplus===25619});
test('Archived or closed loans do not leave recurring prepayments in cash flow',()=>{const plans=[{loanId:'closed',amount:1000,frequency:'Monthly',status:'Active'}],f=FinancialPlanning.cashflow([],[],[{id:'closed',status:'Closed'}],[],[],plans,0,new Date(2026,9,21));return f.plannedPrepayments===0&&f.upcomingPrepayments.length===0});
test('Cash flow reserves the net-worth savings target without double-counting goal contributions',()=>{const f=FinancialPlanning.cashflow([{monthlyAmount:100000}],[],[],[],[{targetAmount:50000,currentAmount:0,monthlyContribution:10000}],[],20);return f.goalContributions===10000&&f.additionalSavings===10000&&f.totalCommitments===20000&&f.surplus===80000});
test('Goal contributions and net future bonuses flow into net-worth projections',()=>{const profile={assets:[],incomes:[],assumptions:{savingsRate:0,contributionGrowth:0,projectionYears:1,inflationRate:0}},future=new Date();future.setDate(future.getDate()+45);const date=`${future.getFullYear()}-${String(future.getMonth()+1).padStart(2,'0')}-${String(future.getDate()).padStart(2,'0')}`,p=NetWorthCalc.project(profile,[],[],LoanCalc,[],[{targetAmount:2000,currentAmount:0,monthlyContribution:100}],[{date,amount:10000,reservePercent:20,emergencyReserve:1000,status:'Confirmed'}]);return p.timeline[1].assets===8200&&p.timeline[1].netWorth===8200});
test('Other debts reduce projected net worth and amortize with payments',()=>{const p=NetWorthCalc.project({assets:[],incomes:[],assumptions:{projectionYears:1,inflationRate:0}},[],[],LoanCalc,[{balance:12000,annualRate:0,monthlyPayment:1000}]);return p.timeline[0].liabilities===12000&&p.timeline[1].liabilities===0&&p.timeline[1].netWorth===0});
test('Inflation-adjusted net worth reflects purchasing power',()=>{const p=NetWorthCalc.project({assets:[{name:'Fund',value:100000,annualGrowth:0}],incomes:[],assumptions:{projectionYears:2,inflationRate:10}},[],[],LoanCalc);return p.timeline[2].netWorth===100000&&p.timeline[2].realNetWorth===82644.63});
test('Goal progress and estimated completion use target and monthly contribution',()=>{const p=FinancialPlanning.goalProjection({targetAmount:100000,currentAmount:40000,monthlyContribution:10000},new Date(2026,0,1));return p.progress===40&&p.remaining===60000&&p.months===6&&p.completionDate==='2026-07-01'&&p.projectedValue===100000&&p.totalContributions===60000&&p.returns===0});
test('Goal projection compounds linked assets and applies their monthly contributions',()=>{const goal={targetAmount:150000,currentAmount:5000,monthlyContribution:0,assetPlans:[{assetId:'fund',monthlyContribution:10000,annualGrowth:12}]},asset={id:'fund',value:100000,annualGrowth:8},p=FinancialPlanning.goalProjection(goal,new Date(2026,0,1),[asset]);return p.startingValue===105000&&p.months===5&&p.completionDate==='2026-06-01'&&p.totalContributions===50000&&p.projectedValue>=150000&&p.growth===p.projectedValue-p.startingValue&&p.returns===p.growth-p.totalContributions});
test('Goal estimate uses Network asset growth unless a scenario override is set',()=>{const goal={targetAmount:200000,currentAmount:0,assetPlans:[{assetId:'fund',monthlyContribution:0,annualGrowth:null}]},asset={id:'fund',value:100000,annualGrowth:10},p=FinancialPlanning.goalProjection(goal,new Date(2026,0,1),[asset]);return p.months===88&&p.startingValue===100000&&p.returns>0});
test('Goal ETA remains unavailable when neither contributions nor positive growth can reach target',()=>{const p=FinancialPlanning.goalProjection({targetAmount:100000,currentAmount:0,monthlyContribution:0,assetPlans:[{assetId:'fund',monthlyContribution:0,annualGrowth:0}]},new Date(2026,0,1),[{id:'fund',value:1000,annualGrowth:0}]);return p.months===null&&p.completionDate===null&&p.totalContributions===0});
test('Linked goal contributions are included in cash flow and stop when assigned assets fund the goal',()=>{const goal={targetAmount:100000,currentAmount:0,monthlyContribution:1000,assetPlans:[{assetId:'fund',monthlyContribution:2500}]},partial=FinancialPlanning.cashflow([],[],[],[],[goal],[],0,new Date(2026,0,1),[{id:'fund',value:40000}]),funded=FinancialPlanning.cashflow([],[],[],[],[goal],[],0,new Date(2026,0,1),[{id:'fund',value:100000}]);return partial.goalContributions===3500&&funded.goalContributions===0});
test('Goal asset plans normalize with bounded contribution and growth assumptions',()=>{const goal=FinancialPlanning.normalize({goals:[{id:'g',name:'Goal',assetPlans:[{assetId:'fund',monthlyContribution:-5,annualGrowth:150},{assetId:'x',monthlyContribution:100}]}]}).goals[0];return goal.assetPlans.length===2&&goal.assetPlans[0].monthlyContribution===0&&goal.assetPlans[0].annualGrowth===100&&goal.assetPlans[1].annualGrowth===null});
test('Goal asset plans remain portable in the goals CSV schema',()=>{const plans=[{assetId:'fund-1',monthlyContribution:10000,annualGrowth:8.5}],goal={id:'g',name:'Home',targetAmount:500000,currentAmount:0,monthlyContribution:0,targetDate:'',createdAt:'',assetPlans:JSON.stringify(plans)},row=CSVUtils.parseCSV(CSVUtils.toCSV([goal],CSVUtils.headers.goals))[0];return CSVUtils.headers.goals.includes('assetPlans')&&JSON.parse(row.assetPlans)[0].assetId==='fund-1'&&JSON.parse(row.assetPlans)[0].annualGrowth===8.5});
test('Net-worth projection includes linked goal contributions without counting asset balance twice',()=>{const profile={assets:[{id:'fund',name:'Fund',value:900,annualGrowth:0}],incomes:[],assumptions:{savingsRate:0,contributionGrowth:0,projectionYears:1,inflationRate:0}},goal={targetAmount:1000,currentAmount:0,monthlyContribution:0,assetPlans:[{assetId:'fund',monthlyContribution:50}]},p=NetWorthCalc.project(profile,[],[],LoanCalc,[],[goal]);return p.timeline[1].assets===1000&&p.timeline[1].savings===100});
test('Net-worth projection does not keep adding contributions after linked goal funding is complete',()=>{const profile={assets:[],incomes:[],assumptions:{savingsRate:0,contributionGrowth:0,projectionYears:2,inflationRate:0}},goal={targetAmount:1200,currentAmount:0,monthlyContribution:0,assetPlans:[{assetId:'fund',monthlyContribution:100}]},p=NetWorthCalc.project(profile,[],[],LoanCalc,[],[goal]);return p.timeline[1].savings===1200&&p.timeline[2].savings===1200});
test('Missing and overdue account reviews are flagged',()=>{const missing=FinancialPlanning.reviewStatus({},new Date(2026,0,1)),overdue=FinancialPlanning.reviewStatus({reviewedAt:'2024-01-01',reviewIntervalMonths:12},new Date(2026,0,1)),current=FinancialPlanning.reviewStatus({reviewedAt:'2025-06-01',reviewIntervalMonths:12},new Date(2026,0,1));return missing.due&&overdue.due&&!current.due});
test('Wealth Manager CSV schemas include emergency eligibility and essential expense flags',()=>CSVUtils.headers.expenses.includes('monthlyAmount')&&CSVUtils.headers.expenses.includes('essential')&&CSVUtils.headers.liabilities.includes('balance')&&CSVUtils.headers.goals.includes('targetAmount')&&CSVUtils.headers.assets.includes('reviewedAt')&&CSVUtils.headers.assets.includes('emergencyEligible'));
test('Emergency-fund target settings round-trip through planning settings CSV',()=>{const rows=[{key:'inflationRate',value:5.5},{key:'emergencyFundMonths',value:9}],restored=CSVUtils.parseCSV(CSVUtils.toCSV(rows,CSVUtils.headers.planningSettings));return CSVUtils.identifyDataType('wealth-manager-planning-settings.csv',CSVUtils.headers.planningSettings)==='planningSettings'&&restored.length===2&&restored[1].key==='emergencyFundMonths'&&restored[1].value==='9'});
test('CSV imports recognize all separately exported planning and loan-history files',()=>CSVUtils.identifyDataType('prepayments.csv',CSVUtils.headers.prepayments)==='prepayments'&&CSVUtils.identifyDataType('bonus_plans.csv',CSVUtils.headers.bonuses)==='bonuses'&&CSVUtils.identifyDataType('transactions.csv',CSVUtils.headers.transactions)==='transactions'&&CSVUtils.identifyDataType('expenses.csv',CSVUtils.headers.expenses)==='expenses');
test('Prepayment, bonus and transaction export rows round-trip their linked fields',()=>{const plan={id:'p',loanId:'l',name:'Monthly',amount:15000,startDate:'2026-12-01',endDate:'',frequency:'Monthly',status:'Active'},bonus={id:'b',name:'Bonus',amount:100000,date:'2027-04-30',frequency:'Annual',reservePercent:20,emergencyReserve:1000,status:'Estimated'},transaction={id:'t',loanId:'l',date:'2026-10-20',type:'Payment',amount:5000,principal:4000,interest:1000,fees:0},p=CSVUtils.parseCSV(CSVUtils.toCSV([plan],CSVUtils.headers.prepayments))[0],b=CSVUtils.parseCSV(CSVUtils.toCSV([bonus],CSVUtils.headers.bonuses))[0],t=CSVUtils.parseCSV(CSVUtils.toCSV([transaction],CSVUtils.headers.transactions))[0];return p.loanId==='l'&&p.startDate==='2026-12-01'&&p.frequency==='Monthly'&&b.date==='2027-04-30'&&b.reservePercent==='20'&&t.loanId==='l'&&t.principal==='4000'});
test('Older LoanPilot backups receive safe defaults for the added planning sections',()=>{const networth=NetWorthCalc.normalize({assets:[],incomes:[],assumptions:{savingsRate:0,projectionYears:1}}),planning=FinancialPlanning.normalize(undefined);return networth.assumptions.inflationRate===5.5&&planning.expenses.length>0&&planning.liabilities.length===0&&planning.goals.length===0});
const ol=document.getElementById('results');tests.forEach(([n,ok,e])=>{const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS — ':'FAIL — ')+n+(e?' ('+e+')':'');ol.appendChild(li)});document.title=`${tests.filter(t=>t[1]).length}/${tests.length} tests passed — Wealth Manager`;
</script>
